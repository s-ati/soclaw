<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — SOCLAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Urbanist"', 'system-ui', 'sans-serif'] },
        colors: {
          gold: { 400: '#f0d060', 500: '#d4af37', 600: '#c5a028', 700: '#a88b20' },
          navy: { 800: '#111d35', 900: '#0d1526', 950: '#0a0e1a' }
        }
      }}
    }
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center px-4 hero-bg">

  <!-- Grid Overlay -->
  <div class="hero-grid absolute inset-0 pointer-events-none"></div>

  <!-- Ambient Glow -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-blue-600/5 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/4 right-1/3 w-[400px] h-[400px] bg-gold-500/5 rounded-full blur-[100px]"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    <!-- Logo -->
    <div class="text-center mb-10">
      <a href="/" class="inline-flex items-center space-x-3">
        <svg class="w-10 h-10 logo-glow" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="l-bolt" x1="10" y1="2" x2="30" y2="38" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f0d060"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#a88b20"/>
            </linearGradient>
            <linearGradient id="l-ring" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="18" stroke="url(#l-ring)" stroke-width="1.5" fill="none"/>
          <path d="M22.5 4L12 22h7.5L16 36l13-18h-8l1.5-14z" fill="url(#l-bolt)"/>
        </svg>
        <span class="text-xl font-bold tracking-tight">
          <span class="text-white">SOC</span><span class="text-gradient-gold">LAW</span>
        </span>
      </a>
      <p class="text-white/40 text-sm mt-3 font-light">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="card-premium rounded-lg p-8">
      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-white/60 mb-2">Email</label>
          <input name="email" type="email" required
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white placeholder-white/25 focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm"
            placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-white/60 mb-2">Password</label>
          <input name="password" type="password" required
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white placeholder-white/25 focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm"
            placeholder="Enter your password">
        </div>
        <button type="submit" class="w-full btn-gold py-3.5 rounded-md text-sm">
          Sign In
        </button>
      </form>

      {% if error %}
      <div class="mt-4 bg-red-500/10 border border-red-500/20 rounded-md px-4 py-3 text-red-300 text-sm">
        {{ error }}
      </div>
      {% endif %}
    </div>

    <!-- Register link -->
    <p class="text-center mt-8 text-white/30 text-sm">
      Don't have an account?
      <a href="/register" class="text-gold-500 hover:text-gold-400 font-semibold transition-colors">Create one free</a>
    </p>
  </div>

</body>
</html>
