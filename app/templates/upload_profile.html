{% extends "base.html" %}
{% block content %}

<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .upload-fade { animation: fadeInUp 0.5s ease-out forwards; }
  .upload-delay { animation: fadeInUp 0.5s ease-out 0.15s forwards; opacity: 0; }
</style>

<!-- Page Header -->
<div class="mb-8 upload-fade">
  <h1 class="text-3xl font-bold text-white flex items-center gap-3">
    <svg class="w-8 h-8 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
    Upload Profile
  </h1>
  <p class="text-white/40 mt-1 font-light">Upload your CV and optional LinkedIn data to begin matching.</p>
</div>

<!-- Error Message -->
{% if error %}
<div class="mb-6 bg-red-500/10 border border-red-500/20 rounded-md px-5 py-4 flex items-center gap-3">
  <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  <p class="text-red-300 text-sm font-medium">{{ error }}</p>
</div>
{% endif %}

<!-- Upload Form (FULL WIDTH) -->
<div class="card-premium rounded-lg p-6 md:p-8 upload-delay">
  <form id="upload-form" method="post" action="/profile/upload" enctype="multipart/form-data">

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Left Column: File Uploads -->
      <div class="space-y-6">
        <!-- CV PDF -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            CV PDF <span class="text-red-400">*</span>
          </label>
          <div id="cv-drop-zone" class="relative border border-dashed border-white/[0.12] rounded-md p-6 text-center hover:border-gold-500/40 hover:bg-gold-500/[0.03] transition-all cursor-pointer">
            <input type="file" name="cv_pdf" accept="application/pdf" required id="cv-input"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
              onchange="handleFileSelect(this, 'cv-label')">
            <svg class="w-10 h-10 text-white/10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <p id="cv-label" class="text-sm text-white/40">
              <span class="font-semibold text-gold-500">Click to upload</span> or drag and drop
            </p>
            <p class="text-xs text-white/20 mt-1">PDF format only (required)</p>
          </div>
        </div>

        <!-- LinkedIn PDF -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            LinkedIn PDF <span class="text-white/30 font-normal">(optional)</span>
          </label>
          <div class="relative border border-dashed border-white/[0.12] rounded-md p-4 text-center hover:border-gold-500/40 hover:bg-gold-500/[0.03] transition-all cursor-pointer">
            <input type="file" name="linkedin_pdf" accept="application/pdf" id="li-input"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
              onchange="handleFileSelect(this, 'li-label')">
            <p id="li-label" class="text-sm text-white/40">
              <span class="font-semibold text-gold-500">Upload LinkedIn PDF</span> (optional)
            </p>
          </div>
        </div>

        <!-- LinkedIn URL -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            LinkedIn URL <span class="text-white/30 font-normal">(optional; will appear on PDF)</span>
          </label>
          <input type="url" name="linkedin_url" placeholder="https://www.linkedin.com/in/..."
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white placeholder-white/25 focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm">
        </div>
      </div>

      <!-- Right Column: Details -->
      <div class="space-y-6">
        <!-- Location -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            Location <span class="text-white/30 font-normal">(optional)</span>
          </label>
          <input type="text" name="location" placeholder="e.g., Munich, Germany"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white placeholder-white/25 focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm">
        </div>

        <!-- Availability -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            Availability <span class="text-white/30 font-normal">(optional)</span>
          </label>
          <select name="availability"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm appearance-none cursor-pointer">
            <option value="" class="bg-navy-950">Select availability</option>
            <option value="immediate" class="bg-navy-950">Immediate</option>
            <option value="2_weeks" class="bg-navy-950">Within 2 weeks</option>
            <option value="1_month" class="bg-navy-950">Within 1 month</option>
            <option value="3_months" class="bg-navy-950">Within 3 months</option>
          </select>
        </div>

        <!-- Remote Only -->
        <div>
          <label class="block text-sm font-semibold text-white/70 mb-2">
            Remote-only? <span class="text-white/30 font-normal">(if yes, onsite jobs will be capped)</span>
          </label>
          <select name="remote_only"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-md px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-gold-500/40 focus:border-gold-500/40 transition-all text-sm appearance-none cursor-pointer">
            <option value="no" class="bg-navy-950">No</option>
            <option value="yes" class="bg-navy-950">Yes</option>
          </select>
        </div>

        <!-- Submit -->
        <div class="pt-4">
          <button type="submit" id="upload-btn"
            class="w-full btn-gold py-3.5 rounded-md text-sm flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Save Profile
          </button>
        </div>
      </div>
    </div>

  </form>
</div>

<script>
  function handleFileSelect(input, labelId) {
    var label = document.getElementById(labelId);
    if (input.files.length > 0) {
      var file = input.files[0];
      if (file.type !== 'application/pdf') {
        label.innerHTML = '<span class="text-red-400 font-semibold">Invalid file type</span> — Please select a PDF file';
        input.value = '';
        return;
      }
      var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
      label.innerHTML = '<span class="text-gold-400 font-semibold">' + file.name + '</span> <span class="text-white/30">(' + sizeMB + ' MB)</span>';
      input.closest('.border-dashed').classList.remove('border-white/[0.12]');
      input.closest('.border-dashed').classList.add('border-gold-500/40', 'bg-gold-500/[0.04]');
    }
  }

  document.getElementById('upload-form').addEventListener('submit', function() {
    var btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Uploading &amp; Processing...';
    btn.classList.add('opacity-75', 'cursor-not-allowed');
  });
</script>

{% endblock %}
