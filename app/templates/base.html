<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOCLAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Urbanist"', 'system-ui', 'sans-serif'] },
          colors: {
            gold: { 400: '#f0d060', 500: '#d4af37', 600: '#c5a028', 700: '#a88b20' },
            navy: { 800: '#111d35', 900: '#0d1526', 950: '#0a0e1a' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-navy-950 font-sans antialiased min-h-screen flex flex-col">

  <!-- Top Navigation -->
  <nav class="bg-navy-950 border-b border-white/[0.06] sticky top-0 z-50 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <a href="/dashboard" class="flex items-center space-x-2.5 flex-shrink-0 group">
          <svg class="w-8 h-8 logo-glow" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nav-bolt" x1="10" y1="2" x2="30" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#f0d060"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#a88b20"/>
              </linearGradient>
              <linearGradient id="nav-ring" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" stroke="url(#nav-ring)" stroke-width="1.5" fill="none"/>
            <path d="M22.5 4L12 22h7.5L16 36l13-18h-8l1.5-14z" fill="url(#nav-bolt)"/>
          </svg>
          <span class="text-lg font-bold tracking-tight">
            <span class="text-white">SOC</span><span class="text-gradient-gold">LAW</span>
          </span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center space-x-1">
          <a href="/dashboard" class="text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-4 py-2 rounded-md text-sm font-medium transition-all">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Dashboard
            </span>
          </a>
          <a href="/profile/upload" class="text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-4 py-2 rounded-md text-sm font-medium transition-all">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
              Upload
            </span>
          </a>
          <a href="/profile/questionnaire" class="text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-4 py-2 rounded-md text-sm font-medium transition-all">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              Questionnaire
            </span>
          </a>
          <a href="/jobs" class="text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-4 py-2 rounded-md text-sm font-medium transition-all">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              Jobs
            </span>
          </a>
        </div>

        <!-- Right side -->
        <div class="flex items-center gap-3">
          <a href="/logout" class="hidden md:inline-flex items-center gap-2 text-white/30 hover:text-red-400 text-sm font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Logout
          </a>
          <!-- Mobile hamburger -->
          <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden text-white/70 hover:text-white p-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-white/[0.06] mt-2 pt-3 space-y-1">
        <a href="/dashboard" class="block text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-3 py-2 rounded-md text-sm transition-all">Dashboard</a>
        <a href="/profile/upload" class="block text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-3 py-2 rounded-md text-sm transition-all">Upload</a>
        <a href="/profile/questionnaire" class="block text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-3 py-2 rounded-md text-sm transition-all">Questionnaire</a>
        <a href="/jobs" class="block text-white/50 hover:text-gold-500 hover:bg-white/[0.04] px-3 py-2 rounded-md text-sm transition-all">Jobs</a>
        <a href="/logout" class="block text-red-400/60 hover:text-red-400 hover:bg-white/[0.04] px-3 py-2 rounded-md text-sm transition-all">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-navy-950 border-t border-white/[0.06] mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
        <div class="flex items-center space-x-2">
          <svg class="w-5 h-5" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.5 4L12 22h7.5L16 36l13-18h-8l1.5-14z" fill="rgba(212,175,55,0.5)"/>
          </svg>
          <span class="text-white/30 font-medium">SOCLAW</span>
        </div>
        <p class="text-white/20">&copy; 2026 SOCLAW. All rights reserved.</p>
      </div>
    </div>
  </footer>

</body>
</html>
