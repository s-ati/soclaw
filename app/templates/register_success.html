<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Created — SOCLAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          gold: { 400: '#f0d060', 500: '#d4af37', 600: '#c5a028', 700: '#a88b20' },
          navy: { 800: '#111d35', 900: '#0d1526', 950: '#0a0e1a' }
        }
      }}
    }
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes progressShrink {
      from { width: 100%; }
      to   { width: 0%; }
    }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .animate-fade-out   { animation: fadeOut 0.5s ease-in forwards; }
    .animate-scale-in   { animation: scaleIn 0.4s ease-out 0.2s forwards; opacity: 0; }
    .animate-progress   { animation: progressShrink 2s linear forwards; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center px-4 hero-bg">

  <!-- Grid Overlay -->
  <div class="hero-grid absolute inset-0 pointer-events-none"></div>

  <!-- Ambient Glow -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/3 w-[500px] h-[500px] bg-gold-500/8 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/3 left-1/3 w-[400px] h-[400px] bg-green-500/5 rounded-full blur-[100px]"></div>
  </div>

  <!-- Notification Card -->
  <div id="notification" class="w-full max-w-md relative z-10 animate-fade-in-up">
    <div class="card-premium rounded-2xl p-8 text-center">
      <!-- Success Icon -->
      <div class="animate-scale-in mb-6">
        <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center border-2 border-gold-500/40" style="background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));">
          <svg class="w-10 h-10 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
      </div>

      <!-- Message -->
      <h1 class="text-2xl font-bold text-white mb-2">Account successfully created.</h1>
      <p class="text-white/40 text-sm mb-6 font-light">Redirecting you to sign in...</p>

      <!-- Progress Bar -->
      <div class="w-full bg-white/[0.06] rounded-full h-1.5 overflow-hidden">
        <div class="h-full rounded-full animate-progress" style="background: linear-gradient(90deg, #d4af37, #f0d060);"></div>
      </div>
    </div>
  </div>

  <script>
    // After 2 seconds, fade out and redirect to sign-in
    setTimeout(function() {
      var el = document.getElementById('notification');
      el.classList.add('animate-fade-out');
      setTimeout(function() {
        window.location.href = '/login';
      }, 500);
    }, 2000);
  </script>

</body>
</html>
