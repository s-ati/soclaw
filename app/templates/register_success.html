<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Created — SOCLAW</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes progressShrink {
      from { width: 100%; }
      to   { width: 0%; }
    }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .animate-fade-out   { animation: fadeOut 0.5s ease-in forwards; }
    .animate-scale-in   { animation: scaleIn 0.4s ease-out 0.2s forwards; opacity: 0; }
    .animate-progress   { animation: progressShrink 2s linear forwards; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center px-4">

  <!-- Background decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/3 w-96 h-96 bg-green-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/3 left-1/3 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Notification Card -->
  <div id="notification" class="w-full max-w-md relative z-10 animate-fade-in-up">
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl text-center">
      <!-- Success Icon -->
      <div class="animate-scale-in mb-6">
        <div class="w-20 h-20 mx-auto bg-green-500/20 rounded-full flex items-center justify-center border-2 border-green-400/40">
          <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
      </div>

      <!-- Message -->
      <h1 class="text-2xl font-bold text-white mb-2">Account successfully created.</h1>
      <p class="text-blue-200 text-sm mb-6">Redirecting you to sign in...</p>

      <!-- Progress Bar -->
      <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
        <div class="h-full bg-gradient-to-r from-green-400 to-amber-400 rounded-full animate-progress"></div>
      </div>
    </div>
  </div>

  <script>
    // After 2 seconds, fade out and redirect to sign-in
    setTimeout(function() {
      var el = document.getElementById('notification');
      el.classList.add('animate-fade-out');
      setTimeout(function() {
        window.location.href = '/login';
      }, 500);
    }, 2000);
  </script>

</body>
</html>
